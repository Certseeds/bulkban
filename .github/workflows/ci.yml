name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check WDAC tooling
        shell: powershell
        run: |
          "Windows: $([Environment]::OSVersion.VersionString)"
          "PowerShell: $($PSVersionTable.PSVersion)"
          $cmd = Get-Command ConvertFrom-CIPolicy -ErrorAction SilentlyContinue
          "ConfigCI: $([bool]$cmd) $(if ($cmd) { $cmd.ModuleName })"
          "Add-SignerRule: $([bool](Get-Command Add-SignerRule -ErrorAction SilentlyContinue))"
          "CiTool: $(Test-Path "$env:SystemRoot\System32\CiTool.exe")"

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
