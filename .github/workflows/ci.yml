name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: Certseeds/common-actions/actions/checkout@v1

      # 与 global.json 保持一致:Native AOT 的 ILCompiler 版本随 SDK 变化,
      # packages.lock.json 只有在同一 SDK 下才能通过 locked mode 还原。
      - uses: Certseeds/common-actions/actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.404

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Check WDAC tooling
        shell: powershell
        run: |
          "Windows: $([Environment]::OSVersion.VersionString)"
          "PowerShell: $($PSVersionTable.PSVersion)"
          $cmd = Get-Command ConvertFrom-CIPolicy -ErrorAction SilentlyContinue
          "ConfigCI: $([bool]$cmd) $(if ($cmd) { $cmd.ModuleName })"
          "Add-SignerRule: $([bool](Get-Command Add-SignerRule -ErrorAction SilentlyContinue))"
          "CiTool: $(Test-Path "$env:SystemRoot\System32\CiTool.exe")"

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
